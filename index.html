.d{font-family:Aktiv,"Arial Black",sans-serif;font-weight:800;line-height:.9;letter-spacing:-.02em}
h1.d{font-size:clamp(3.5rem,24vw,12rem)}h2.d{font-size:clamp(2.4rem,13vw,6.5rem)}
.sc{font-family:Sloop,cursive;font-weight:400;line-height:1.05}
.s{position:relative;overflow:hidden;padding:14vh 6vw}
.c-n{background:var(--n)}.c-a{background:var(--a)}.c-b{background:var(--b);color:var(--n)}.c-r{background:var(--r);color:var(--w)}.c-w{background:var(--w)}
.bg,.ov{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ov{background:var(--b);pointer-events:none}
.in{position:relative}
/* scroll-linked fly-in: --q goes 1 -> 0 as the element rises into view, and back on scroll up */
.fy{transform:translate3d(var(--x,0),0,0) rotate(calc(var(--rot,0deg) + var(--q,0)*var(--dd,1)*5deg))}
.wg i{display:inline-block;font-style:normal;transform:rotate(var(--r));animation:wg .8s steps(1) var(--t) infinite}
.wg b{display:inline-block;white-space:nowrap;font-weight:inherit}
@keyframes wg{50%{transform:rotate(calc(var(--r)*-1)) translateY(-.02em)}}
@media(prefers-reduced-motion:reduce){.wg i{animation:none}}
.im{position:relative;background:var(--b);overflow:hidden}
.im:empty{min-height:12rem}.im img{display:block;width:100%;height:100%;object-fit:cover}
/* hero */
.hero{min-height:100vh;min-height:100svh;padding:0;background:var(--n)}
.sh{position:absolute;display:block}
.sh1{background:var(--r);width:78vw;height:58vh;left:-10vw;top:20vh;clip-path:polygon(0 12%,62% 0,100% 38%,72% 100%,10% 78%)}
.sh2{background:var(--a);width:48vw;height:20vh;right:-6vw;top:4vh;clip-path:polygon(0 30%,80% 0,100% 60%,30% 100%)}
.sh3{background:var(--b);width:130vw;height:30vh;left:-15vw;bottom:-6vh;clip-path:polygon(0 60%,100% 0,100% 100%,0 100%)}
.hh{position:relative;z-index:3;padding:8vh 6vw 0}
.hh .sc{color:var(--r);font-size:clamp(2rem,9vw,4.5rem);transform:rotate(-4deg);margin-bottom:.4rem}
.hi{position:absolute;z-index:2;left:0;right:0;margin:auto;bottom:9vh;width:min(88vw,560px);height:56vh;background:none}
.hi img{object-fit:contain}
.ar{position:absolute;z-index:4;left:50%;bottom:3vh;width:16px;height:16px;border:solid var(--n);border-width:0 3px 3px 0;transform:translateX(-50%) rotate(45deg)}
/* about */
.ab{display:grid;gap:9vh;align-items:center}
.pol{--rot:-3deg;background:var(--w);padding:4% 4% 6%;width:min(82vw,380px)}
.pol .im{aspect-ratio:4/5}.pol .sc{font-size:2.4rem;margin-top:.6rem}
.s-about h2{color:var(--r)}
.tx{--rot:2deg;background:var(--a);padding:1.4rem;font-weight:500;margin-top:1.5rem}
@media(min-width:900px){.ab{grid-template-columns:1fr 1fr;gap:6vw}}
/* toc */
.toc{margin-top:6vh;font-size:.9rem;max-width:40rem}
.toc a{display:flex;gap:.6rem;align-items:baseline;color:inherit;text-decoration:none;padding:.55rem 0}
.toc .l{flex:1;border-bottom:2px dashed currentColor}
/* gallery */
.gl{display:grid;gap:4vw;grid-template-columns:1fr;margin-top:6vh}
.gl .im{aspect-ratio:4/3}.g{position:relative}
@media(min-width:700px){.gl{grid-template-columns:repeat(2,1fr)}}
.end{margin-top:14vh;font-size:clamp(2.6rem,12vw,6rem);color:var(--a)}
.s-text p{max-width:40rem;margin-top:3vh}
model-viewer{width:100%;height:70vh;margin-top:4vh;--poster-color:transparent}
/* footer + dialog */
.ft{background:var(--b);color:var(--n);padding:6vh 6vw;font-size:.8rem;display:flex;flex-wrap:wrap;gap:1.2rem 3rem;justify-content:space-between}
.ft a{color:inherit;cursor:pointer}
dialog{max-width:min(90vw,560px);border:0;background:var(--n);color:var(--b);padding:1.6rem}
dialog p{margin:.8rem 0}dialog::backdrop{background:#3c140fcc}
/* editor */
.edit .im{cursor:pointer;outline:2px dashed var(--r);outline-offset:-2px}
.edit .im::after{content:"Заменить";position:absolute;left:0;top:0;background:var(--r);color:#fff;font:.7rem "Roboto Mono",monospace;padding:.2rem .5rem}
.edit [contenteditable]{outline:1px dashed #e84e3e99;min-width:2ch}
.tb{position:absolute;right:0;top:0;z-index:20;display:flex;gap:2px;flex-wrap:wrap;background:var(--b);padding:4px;max-width:100%}
.top{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--b);color:var(--n);display:flex;gap:4px;padding:6px;flex-wrap:wrap;align-items:center;font-size:.75rem}
.tb button,.top button,.tb select,.top select{font:inherit;font-size:.72rem;background:var(--n);color:var(--b);border:0;padding:.4rem .6rem;cursor:pointer}
.x{position:absolute;right:0;top:0;z-index:5;background:var(--r);color:#fff;border:0;padding:.3rem .6rem;font:.72rem "Roboto Mono",monospace}
.ad{margin-top:1rem;padding:.6rem 1rem;border:0;background:var(--a);color:var(--b);font:inherit}
</style></head>
<body>
<main id="app"></main>
<div id="bar"></div>
<script>
const Q=new URLSearchParams(location.search),EDIT=Q.has('edit'),$=id=>document.getElementById(id);
let S;const U=new Map();
const D={site:{contact:"Contact: your@email.com"},sections:[
{t:"hero",c:"n",sub:"Shevchenko's",title:"YEHOR",img:""},
{t:"about",c:"n",title:"Who am I",img:"",cap:"Yehor",text:"Digital designer and animator. Branding, packaging, vector illustration."},
{t:"toc",c:"n",title:"Table of Contents"},
{t:"gallery",c:"b",title:"Branding & Packaging",items:["","","",""],cap:"Project name"},
{t:"model",c:"a",title:"Can in 3D",src:""}]};
const NEW={gallery:{t:"gallery",c:"b",title:"New project",items:["",""],cap:"Project name"},
text:{t:"text",c:"n",title:"Title",body:"Text"},model:{t:"model",c:"a",title:"3D",src:""},
about:D.sections[1],toc:D.sections[2]};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ed=(p,v,t,c)=>`<${t} class="${c||''}"${EDIT?` contenteditable data-p="${p}"`:''}>${esc(v)}</${t}>`;
const im=(p,v,c)=>`<div class="im ${c||''}" data-img="${p}">${v?`<img src="${esc(v)}" alt="">`:''}</div>`;
const fy=(d,h)=>`<div class="fy" data-d="${d}">${h}</div>`;
const T={
hero:(s,i)=>`<i class="sh sh1 fy" data-d="-1"></i><i class="sh sh2 fy" data-d="1"></i><i class="sh sh3"></i>${im(i+'.img',s.img,'hi')}<div class="hh">${ed(i+'.sub',s.sub,'div','sc wg')}${ed(i+'.title',s.title,'h1','d wg')}</div><a class="ar" href="#s1"></a>`,
about:(s,i)=>`<div class="ab in"><div class="fy pol" data-d="-1">${im(i+'.img',s.img)}${ed(i+'.cap',s.cap,'div','sc')}</div><div>${fy(1,ed(i+'.title',s.title,'h2','d wg'))}<div class="fy tx" data-d="1">${ed(i+'.text',s.text,'p')}</div></div></div>`,
toc:(s,i)=>{let n=0;return `<div class="in">${fy(-1,ed(i+'.title',s.title,'h2','d wg'))}<nav class="toc">${S.sections.map((q,j)=>['gallery','model','text'].includes(q.t)?`<a href="#s${j}"><span>${esc(q.title)}</span><span class="l"></span><span>/${++n}/</span></a>`:'').join('')}</nav></div>`},
gallery:(s,i)=>`<div class="in">${fy(-1,ed(i+'.title',s.title,'h2','d wg'))}<div class="gl">${s.items.map((u,j)=>`<div class="g">${im(i+'.items.'+j,u)}${EDIT?`<button class="x" data-act="rm" data-i="${i}" data-j="${j}">Удалить</button>`:''}</div>`).join('')}</div>${EDIT?`<button class="ad" data-act="add" data-i="${i}">Добавить картинку</button>`:''}${fy(1,ed(i+'.cap',s.cap,'div','sc end'))}</div>`,
model:(s,i)=>`<div class="in">${fy(-1,ed(i+'.title',s.title,'h2','d wg'))}${s.src?`<model-viewer src="${esc(s.src)}" camera-controls auto-rotate shadow-intensity="1" loading="lazy"></model-viewer>`:''}${EDIT?`<p>Путь к .glb: ${ed(i+'.src',s.src,'span')}</p>`:''}</div>`,
text:(s,i)=>`<div class="in">${fy(-1,ed(i+'.title',s.title,'h2','d wg'))}${fy(1,ed(i+'.body',s.body,'p'))}</div>`};
const tb=(s,i)=>`<div class="tb"><button data-act="up" data-i="${i}">Вверх</button><button data-act="dn" data-i="${i}">Вниз</button><button data-act="del" data-i="${i}">Удалить</button><button data-img="${i}.bg">Фон</button><button data-act="nobg" data-i="${i}">Без фона</button><select data-act="c" data-i="${i}">${[['n','Беж'],['a','Беж акцент'],['b','Коричневый'],['r','Красный'],['w','Белый']].map(([k,v])=>`<option value="${k}"${s.c==k?' selected':''}>${v}</option>`).join('')}</select><input type="range" min="0" max="90" value="${s.ov||0}" data-act="ov" data-i="${i}" title="Оверлей"></div>`;
const LG={p:`<h3 class="d">Privacy Policy</h3><p>This site does not use cookies or analytics and does not collect personal data. Messages sent to the contact address are used only to reply.</p>`,
t:`<h3 class="d">Terms of Use</h3><p>All works and texts on this site are © 2026 Yehor Shevchenko unless stated otherwise. Reuse requires written permission.</p><p>Fonts made from <a href="http://www.onlinewebfonts.com">Web Fonts</a> are licensed by CC BY 4.0.</p>`};
function render(){
$('app').innerHTML=S.sections.map((s,i)=>`<section id="s${i}" class="s s-${s.t} c-${s.c||'n'}${s.t=='hero'?' hero':''}">${s.bg?`<img class="bg" src="${esc(s.bg)}" alt="">`:''}<i class="ov" style="opacity:${(s.ov||0)/100}"></i>${EDIT?tb(s,i):''}${T[s.t](s,i)}</section>`).join('')
+`<footer class="ft">${ed('site.contact',S.site.contact,'div')}<div><a data-lg="p">Privacy Policy</a> &nbsp; <a data-lg="t">Terms of Use</a></div><div>SHENKO — Yehor Shevchenko Digital Solutions. © 2026</div></footer>`;
if(!EDIT)document.querySelectorAll('.wg').forEach(e=>{e.innerHTML=e.textContent.split(' ').map(w=>`<b>${[...w].map(c=>`<i style="--r:${(Math.random()*5-2.5).toFixed(1)}deg;--t:${(Math.random()*.7).toFixed(2)}s">${esc(c)}</i>`).join('')}</b>`).join(' ')});
tick()}
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
function tick(){if(still)return;const h=innerHeight;document.querySelectorAll('.fy').forEach(e=>{const r=e.getBoundingClientRect(),d=+e.dataset.d||1;let p=Math.min(1,Math.max(0,(h-r.top)/(h*.55)));const q=Math.pow(1-p,3);e.style.setProperty('--q',q);e.style.setProperty('--dd',d);e.style.setProperty('--x',q*d*60+'vw')})}
addEventListener('scroll',tick,{passive:true});addEventListener('resize',tick);
function ref(p){const k=p.split('.');let o=k[0]=='site'?S:S.sections;for(let i=0;i<k.length-1;i++)o=o[k[i]];return[o,k[k.length-1]]}
const set=(p,v)=>{const[o,k]=ref(p);o[k]=v};
function pick(p){const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>{const r=new Image;r.onload=()=>{const k=Math.min(1,1600/Math.max(r.width,r.height)),c=document.createElement('canvas');c.width=r.width*k;c.height=r.height*k;c.getContext('2d').drawImage(r,0,0,c.width,c.height);set(p,c.toDataURL('image/webp',.85));render()};r.src=URL.createObjectURL(f.files[0])};f.click()}
const st=m=>{$('st').textContent=m};
function cfg(){const repo=prompt('Репозиторий (владелец/имя)'),t=prompt('GitHub токен (доступ Contents: write только к этому репо)');if(repo&&t)localStorage.gh=JSON.stringify({repo,t,br:'main'})}
async function gh(path,b64){const c=JSON.parse(localStorage.gh),u=`https://api.github.com/repos/${c.repo}/contents/${path}`,h={Authorization:'Bearer '+c.t,Accept:'application/vnd.github+json'};const g=await fetch(u+'?ref='+c.br,{headers:h});const sha=g.ok?(await g.json()).sha:undefined;const r=await fetch(u,{method:'PUT',headers:h,body:JSON.stringify({message:'Update '+path,content:b64,branch:c.br,sha})});if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,120))}
async function push(){try{if(!localStorage.gh)cfg();if(!localStorage.gh)return;st('Отправка...');const out=JSON.parse(JSON.stringify(S)),up=[];
(function w(o){for(const k in o){const v=o[k];if(typeof v=='string'&&v.startsWith('data:image')){if(!U.has(v)){const x=v.slice(5,v.indexOf(';')).split('/')[1].replace('jpeg','jpg');U.set(v,'img/'+Date.now().toString(36)+U.size+'.'+x);up.push([U.get(v),v.split(',')[1]])}o[k]=U.get(v)}else if(v&&typeof v=='object')w(v)}})(out);
for(const[n,b]of up)await gh(n,b);
await gh('content.json',btoa(unescape(encodeURIComponent(JSON.stringify(out,null,1)))));st('Отправлено. Сайт обновится через 1–2 минуты.')}catch(e){st('Ошибка: '+e.message)}}
document.addEventListener('click',e=>{
const lg=e.target.closest('[data-lg]');if(lg){const d=$('dg')||document.body.appendChild(Object.assign(document.createElement('dialog'),{id:'dg'}));d.innerHTML=LG[lg.dataset.lg]+'<p><a href="#" onclick="dg.close();return false">Close</a></p>';d.showModal();return}
if(!EDIT)return;
const m=e.target.closest('[data-img]');if(m){pick(m.dataset.img);return}
const b=e.target.closest('button[data-act]');if(!b)return;const a=b.dataset.act,i=+b.dataset.i,L=S.sections;
if(a=='addsec')L.push(structuredClone(NEW[$('nt').value]));
else if(a=='push')return push();
else if(a=='json'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)]));l.download='content.json';l.click();return}
else if(a=='cfg'){localStorage.removeItem('gh');cfg();return}
else if(a=='up'&&i>0)[L[i-1],L[i]]=[L[i],L[i-1]];
else if(a=='dn'&&i<L.length-1)[L[i+1],L[i]]=[L[i],L[i+1]];
else if(a=='del'){if(!confirm('Удалить раздел?'))return;L.splice(i,1)}
else if(a=='nobg')delete L[i].bg;
else if(a=='add')L[i].items.push('');
else if(a=='rm')L[i].items.splice(+b.dataset.j,1);
render()});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.p)set(t.dataset.p,t.innerText);else if(t.dataset.act=='ov'){S.sections[+t.dataset.i].ov=+t.value;t.closest('section').querySelector('.ov').style.opacity=t.value/100}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.act=='c'){S.sections[+t.dataset.i].c=t.value;render()}});
document.addEventListener('paste',e=>{if(!EDIT)return;e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))});
(async()=>{try{const r=await fetch('content.json?'+Date.now());if(r.ok)S=await r.json()}catch(e){}
S=S||structuredClone(D);
if(EDIT){document.body.classList.add('edit');$('bar').innerHTML=`<div class="top"><select id="nt">${Object.keys(NEW).map(k=>`<option>${k}</option>`).join('')}</select><button data-act="addsec">Добавить раздел</button><button data-act="push">Push</button><button data-act="json">Скачать JSON</button><button data-act="cfg">GitHub</button><span id="st"></span></div>`}
render()})();
</script></body></html>
