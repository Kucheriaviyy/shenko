<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHENKO builder</title>
<style>
@font-face{font-family:Aktiv;src:url(assets/fonts/Aktiv_Grotesk_Ex_XBold.woff2) format("woff2");font-weight:800}
:root{--ac:#e84e3e;--br:#3c140f;--bg:#f4efea;--pn:#fff;--ln:#e6dcd3}
*{box-sizing:border-box;margin:0;border-radius:0}
body{height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--br);font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
h4,h5,.logo,.gh{font-family:Aktiv,"Arial Black",sans-serif;font-weight:800;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:1px solid var(--ln);padding:.38rem .7rem;cursor:pointer;transition:background .15s,color .15s,border-color .15s,transform .15s}
button:hover{border-color:var(--br)}button:active{transform:translateY(1px)}
button.on{background:var(--br);color:#fff;border-color:var(--br)}button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
#top{display:flex;gap:6px;align-items:center;padding:0 12px;min-height:48px;flex-wrap:wrap;background:var(--pn);border-bottom:1px solid var(--ln)}
.logo{font-size:16px;margin-right:14px}.sp{flex:1}#st{opacity:.7;max-width:260px}
.seg{display:flex}.seg button+button{margin-left:-1px}
#main{flex:1;display:flex;min-height:0}
#rail{width:64px;flex:none;background:var(--pn);border-right:1px solid var(--ln)}
#rail button{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;border:0;padding:12px 0;font-size:11px}
#rail button.on{background:var(--bg);color:var(--br);box-shadow:inset 3px 0 var(--ac)}
#left,#right{background:var(--pn);overflow:auto;padding:14px}
#left{width:280px;flex:none;border-right:1px solid var(--ln)}#right{width:310px;flex:none;border-left:1px solid var(--ln)}
#stage{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:20px;background:#e9e3dd}
#dev{transform-origin:top center;flex:none;background:#fff;box-shadow:0 10px 40px rgba(60,20,15,.18);transition:transform .25s}
#fr{display:block;border:0;background:#ffebde;transition:width .25s,height .25s}
h4{font-size:15px;margin-bottom:10px}h5{font-size:11px;margin:16px 0 8px;opacity:.55}
.fi{animation:fi .22s ease both}@keyframes fi{from{opacity:0;transform:translateY(5px)}}
.hrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.hrow h4{margin:0}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.lib{border:1px solid var(--ln);padding:14px 6px;text-align:center;cursor:grab;transition:border-color .15s,transform .15s,background .15s}
.lib:hover{border-color:var(--ac);transform:translateY(-2px);background:#fff8f3}
.row{display:flex;gap:4px;align-items:center;padding:6px;border:1px solid transparent;cursor:pointer;transition:background .15s}
.row:hover{background:var(--bg)}.row.on{background:#ffe3d8;border-color:var(--ac)}.row.dim .nm{opacity:.4}
.nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tag{font-size:10px;opacity:.55}
.row button{border:0;padding:3px;display:flex;opacity:.55}.row button:hover{opacity:1}
.gh{display:flex;justify-content:space-between;align-items:center;margin:12px 0 3px;font-size:11px}.gh button{border:0;font-family:system-ui;font-weight:400;opacity:.6;padding:0}
.ind{margin-left:14px}.dt-b{box-shadow:0 -2px 0 var(--ac)}.dt-a{box-shadow:0 2px 0 var(--ac)}
.f{display:block;margin-bottom:9px}.f span{display:block;opacity:.65;margin-bottom:3px;font-size:12px}
.f.ck{display:flex;gap:8px;align-items:center}.f.ck span{margin:0;opacity:1}.f.ck input{width:auto}
input[type=text],input[type=number],select,textarea{width:100%;border:1px solid var(--ln);background:#fff;padding:.4rem;font:inherit;color:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
.f button{margin-top:4px}.xy{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.wide{width:100%;margin-top:12px}
.hint{opacity:.65}.th{display:grid;gap:6px;margin-bottom:6px}.ti{display:flex;gap:6px;align-items:center;border:1px solid var(--ln);padding:4px}.ti img{width:56px;height:42px;object-fit:cover;flex:none}.ti div{display:flex;flex-wrap:wrap;gap:3px}.ti button{padding:.15rem .4rem;font-size:11px}input[type=color]{width:44px;height:28px;padding:0;border:1px solid var(--ln)}#right button{margin:0 4px 4px 0}
</style></head>
<body>
<header id="top"><span class="logo">SHENKO builder</span>
<div class="seg"><button data-d="phone">Телефон</button><button data-d="tablet">Планшет</button><button data-d="laptop">Ноутбук</button></div>
<button data-a="grid">Сетка</button><button data-a="undo">Отменить</button><button data-a="anim" title="В превью буквы не анимируются, так быстрее">Анимации в превью</button><span class="sp"></span><span id="sv" style="opacity:.55;font-size:11px"></span><span id="st"></span>
<button data-a="open">Открыть сайт</button><button data-a="json">content.json</button><button data-a="cfg">GitHub</button><button data-a="diag" title="Проверить связь с GitHub">Связь</button><button data-a="push" class="pri">Push</button></header>
<div id="main"><nav id="rail"></nav><aside id="left"></aside><div id="stage"><div id="dev"><iframe id="fr" title="preview"></iframe></div></div><aside id="right"></aside></div>
<script src="assets/js/editor.js?v=14"></script>
</body></html>
